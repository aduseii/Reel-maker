name: iPhone app

# Builds an unsigned ReelMaker.ipa on a Mac and publishes it as the "ios" pre-release
# (pre-releases don't count as the "latest" release the Windows updater reads).
# Install it with Sideloadly, which signs it with your own Apple ID.
on:
  push:
    branches: [main]
    paths: ["ios/**", "app/fonts/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen >/dev/null
          xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project ReelMaker.xcodeproj -scheme ReelMaker -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION="$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml).${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            # compiler errors become annotations so they can be read without the full log
            grep -E "^/.*error:" build.log | sort -u | head -40 | while IFS= read -r line; do
              file=$(echo "$line" | cut -d: -f1 | sed "s#^$PWD/##"); ln=$(echo "$line" | cut -d: -f2)
              msg=$(echo "$line" | sed -E 's/^[^:]*:[0-9]+:[0-9]+: error: //')
              echo "::error file=ios/$file,line=$ln::$msg"
            done
            grep -E "error:" build.log | grep -v "^/" | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Package the .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ReelMaker.app Payload/
          zip -qry ReelMaker.ipa Payload
          ls -la ReelMaker.ipa

      - name: Publish the "ios" pre-release
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/ios"
          # an AltStore source: add $base/altstore-source.json in AltStore → Sources to get updates there
          python3 - "$ver" "${{ github.run_number }}" "$(stat -f %z ReelMaker.ipa)" "$base" "$GITHUB_REPOSITORY" <<'PY'
          import json, sys, datetime
          ver, build, size, base, repo = sys.argv[1:]
          v = f"{ver}.{build}"
          src = {"name": "Reel Maker", "identifier": "com.aduseii.reelmaker.source",
                 "apps": [{"name": "Reel Maker", "bundleIdentifier": "com.aduseii.reelmaker", "developerName": "aduseii",
                           "localizedDescription": "Turn a 16:9 video into an Instagram reel with your saved templates.",
                           "iconURL": f"https://raw.githubusercontent.com/{repo}/main/ios/ReelMaker/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                           "tintColor": "FFA53A",
                           "version": v, "versionDate": datetime.date.today().isoformat(),
                           "downloadURL": f"{base}/ReelMaker.ipa", "size": int(size),
                           "versions": [{"version": v, "buildVersion": build,
                                         "date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                                         "downloadURL": f"{base}/ReelMaker.ipa", "size": int(size), "minOSVersion": "16.0"}]}],
                 "news": []}
          json.dump(src, open("altstore-source.json", "w"), indent=1)
          PY
          gh release delete ios -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create ios ReelMaker.ipa altstore-source.json -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Reel Maker for iPhone $ver.${{ github.run_number }}" \
            --notes "Install with AltStore (My Apps → +) or Sideloadly. AltStore source for updates: $base/altstore-source.json"
