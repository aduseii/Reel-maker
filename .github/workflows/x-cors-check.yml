name: X CORS check (temporary)
on:
  push:
    paths: [.github/workflows/x-cors-check.yml]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Do the public FxTwitter / vxTwitter APIs allow websites to read them?
        run: |
          ORIGIN="https://aduseii.github.io"
          for id in 1790637656616943991 1578353380363501568; do
            for url in "https://api.fxtwitter.com/i/status/$id" "https://api.vxtwitter.com/i/status/$id"; do
              curl -s -D h.txt -o r.json -H "Origin: $ORIGIN" "$url"
              code=$(head -1 h.txt | tr -d '\r'); acao=$(grep -i '^access-control-allow-origin' h.txt | tr -d '\r')
              info=$(python3 -c "
          import json
          try:
              d=json.load(open('r.json'))
              t=d.get('tweet') or d
              vids=[m for m in ((t.get('media') or {}).get('videos') or [])] or [u for u in t.get('mediaURLs') or [] if '.mp4' in u]
              print('text:', repr((t.get('text') or '')[:50]), 'videos:', len(vids))
          except Exception as e: print('not json')
          ")
              echo "::notice::$url → $code | ${acao:-no CORS header} | $info"
            done
          done
