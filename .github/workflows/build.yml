name: Build installer

# Every push to main builds ReelMakerSetup.exe. When __version__ in app/core.py
# is a version that hasn't been released yet, the installer is also published
# as a GitHub Release (tag v<version>). Each run's installer is under "Artifacts".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/core.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: Build
        run: bash installer/build.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReelMakerSetup-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Reel Maker ${{ steps.ver.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
