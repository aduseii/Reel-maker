name: Build installer

# Every push to main builds ReelMakerSetup.exe (download it from the run's
# "Artifacts"). Pushing a tag like v1.2.0 also publishes it as a Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: Build
        run: bash installer/build.sh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReelMakerSetup
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
