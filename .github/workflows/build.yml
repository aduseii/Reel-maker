name: Build installer

# Every push to main builds ReelMakerSetup.exe. When __version__ in app/core.py
# is a version that hasn't been released yet, the installer is also published
# as a GitHub Release (tag v<version>). Each run's installer is under "Artifacts".
on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app/core.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check GitHub sign-in setup
        run: |
          python3 - <<'PY'
          import sys, json; sys.path.insert(0, "app")
          import types; sys.modules["core"] = types.SimpleNamespace(APPDATA="/tmp", TEMPLATE_DIR="/tmp", __version__="ci")
          import cloud
          try:
              s = cloud.GitHubCloud().start_sign_in()
              print(f"GitHub sign-in OK: device flow started (code expires in {s['expires_in']}s)")
          except Exception as e:
              print(f"::error::GitHub sign-in check failed: {e}")
              sys.exit(1)
          PY

      - name: Check X link import (information only)
        continue-on-error: true
        run: |
          python3 -m pip install -q yt-dlp
          python3 - <<'PY'
          import sys, types, shutil, os
          sys.path.insert(0, "app")
          sys.modules["core"] = types.SimpleNamespace(
              APPDATA="/tmp/rm", __version__="ci", find_ffmpeg=lambda: shutil.which("ffmpeg"),
              version_tuple=lambda v: tuple(int(n) for n in __import__("re").findall(r"\d+", v or "")[:4]) or (0,))
          import x_import as X
          # public posts with native video, taken from yt-dlp's own tests
          links = ["https://x.com/historyinmemes/status/1790637656616943991",
                   "https://x.com/DavidToons_/status/1578353380363501568"]
          for link in links:
              st = {}
              try:
                  post = X.get_post(X.find_link(link), st)
                  path = X.download_video(post, 0, {})
                  print(f"X import OK with yt-dlp {post['version']}: {os.path.getsize(path)} bytes, caption {post['caption']!r}")
                  print(f"::notice::X import works ({link})")
                  break
              except Exception as e:
                  print(f"::warning::X import check failed for {link}: {e} | details: {st.get('errors')}")
          PY

      - name: Stage the app (Windows Python, Qt, app files)
        run: STAGE_ONLY=1 bash installer/build.sh && tar czf stage.tgz -C build ReelMaker installer.nsi

      - name: Keep the staged app for the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: stage
          path: stage.tgz
          retention-days: 1

    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}

  # The launcher and installer are built on Windows, which already has NSIS and MinGW,
  # so a release doesn't depend on Linux package mirrors.
  package:
    needs: build
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: stage

      - name: Unpack
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          tar xzf stage.tgz -C build

      - name: Find NSIS and MinGW
        run: |
          $nsis = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS") | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsis) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS" }
          $gcc = (Get-Command gcc.exe -ErrorAction SilentlyContinue).Source
          if (-not $gcc -and (Test-Path C:\mingw64\bin\gcc.exe)) { $gcc = "C:\mingw64\bin\gcc.exe" }
          if (-not $gcc) { choco install mingw -y --no-progress; $gcc = "C:\ProgramData\mingw64\mingw64\bin\gcc.exe" }
          $bin = Split-Path $gcc
          "$nsis" | Out-File -Append $env:GITHUB_PATH
          "$bin" | Out-File -Append $env:GITHUB_PATH
          & "$nsis\makensis.exe" /VERSION; & $gcc --version | Select-Object -First 1

      - name: Build ReelMaker.exe launcher
        working-directory: installer/launcher
        run: |
          Copy-Item ..\..\app\icon.ico icon.ico
          windres launcher.rc -O coff -o launcher.res
          if ($LASTEXITCODE) { exit 1 }
          gcc -O2 -municode -mwindows -static -s launcher.c launcher.res -o ReelMaker.exe -lshell32
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item ReelMaker.exe ..\..\build\ReelMaker\python\ReelMaker.exe

      - name: Build installer
        working-directory: build
        run: |
          makensis /V2 "/DVER=${{ needs.build.outputs.version }}" installer.nsi
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force ..\dist | Out-Null
          Move-Item ReelMakerSetup.exe "..\dist\ReelMakerSetup-${{ needs.build.outputs.version }}.exe"
          Get-Item ..\dist\*.exe | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ReelMakerSetup-${{ needs.build.outputs.version }}
          path: dist/*.exe

      - name: Publish release
        if: needs.build.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Reel Maker ${{ needs.build.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
